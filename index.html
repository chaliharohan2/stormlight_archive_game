<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Way of Kings — A Stormlight Archive Game</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- Vendored Three.js. The import map lets the addons in vendor/jsm (which
         import the bare specifier "three") resolve to the SAME module URL our
         own code imports relatively, so there is only ever one THREE instance.
         No bundler or network fetch involved. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="frame">
      <div id="stage">
        <canvas id="game3d" width="960" height="600" aria-hidden="true"></canvas>
        <canvas id="game" width="960" height="600" aria-label="The Way of Kings game"></canvas>
      </div>
      <div id="controls">
        <span><b>Move</b> WASD / Arrows</span>
        <span><b>Interact</b> E / Enter</span>
        <span><b>Strike</b> Space / J</span>
        <span><b>Dash (Stormlight)</b> Shift / K</span>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
